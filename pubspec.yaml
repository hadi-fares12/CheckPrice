name: my_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  excel: ^2.0.7
  file_selector: ^1.0.3
  path_provider: ^2.0.15
  mobile_scanner: ^3.2.0
  shared_preferences: ^2.2.2
  share_plus: ^7.2.1
  permission_handler: ^11.3.1
  http: ^0.13.5
  cupertino_icons: ^1.0.8
  url_launcher: ^6.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  # Add your app icon here
  assets:
    - assets/icon/

# Configuration for app icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  
  # Adaptive icon for Android (optional but recommended)
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  
  # Remove old Flutter icon
  remove_alpha_ios: true